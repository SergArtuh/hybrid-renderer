[package]
name = "hybrid-renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "hybrid_renderer"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["shader-hot-reload"]
shader-hot-reload = []

[dependencies]
winit = "0.29"
wgpu = "30.0"
pollster = "0.3"
log = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }
image = "0.25.9"
glam = { version = "0.32.0", features = ["bytemuck", "mint"] }
anyhow = "1.0.102"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
gltf = { version = "1.4.1", features = ["extensions", "names"] }
half = { version = "2.7.1", features = ["bytemuck"] }
serde_json = "1.0.150"
uuid = { version = "1.26.0", features = ["js", "v4"] }
exr = "1.74.2"
futures-util = "0.3.34"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
ureq = "2.9"
notify = { version = "8.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "0.2.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement"
] }

[lints.clippy]
arc_with_non_send_sync = "allow"

[[example]]
name = "model_viewer"
path = "examples/model_viewer.rs"

[[example]]
name = "env_map"
path = "examples/dev/env_map.rs"

[[example]]
name = "simple_sphere"
path = "examples/dev/simple_sphere.rs"

[[example]]
name = "sprite_animation"
path = "examples/dev/sprite_animation.rs"

[[example]]
name = "sdf_viewer"
path = "examples/dev/sdf_viewer.rs"
